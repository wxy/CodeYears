<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CodeYears 个人经历里程碑对照</title>
<style>body{font:15px system-ui;margin:24px;background:#f4f5f1;color:#26392f}button,select{font:inherit;margin:4px;padding:7px}#scene{height:620px;background:#e9eee6}#summary{min-height:75px;padding:12px;background:white;border-left:4px solid #b9964b}small{display:block;margin:10px}h1{font-size:22px}</style>
<h1>个人经历里程碑 · 工程对照</h1><small>全部为确定性合成贡献与合成事件证据；未实现历史取数。城市、道路、楼体完全沿用固定基线。</small>
<label>证据场景 <select id="case"><option value="later">异日首库 · 完整证据</option><option value="same">同日注册 / 首库</option><option value="weak">证据不足</option><option value="absent">无注册证据</option><option value="range">范围排除注册塔</option></select></label>
<label>输入 <select id="density"><option>稀疏</option><option>稠密</option><option>多年</option></select></label>
<button id="mode">候选摘要：关（基线）</button><button id="out">−</button><button id="in">＋</button><button id="reset">整体</button><button id="near">注册日近景</button><button id="reuse">隐藏 / 恢复同页画布</button>
<div id="summary"></div><div id="scene"></div><small id="status"></small><script type="module" src="./main.ts"></script></html>
