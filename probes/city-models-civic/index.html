<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CodeYears 公共服务候选审查</title><style>body{margin:20px;background:#e9e5d9;color:#26392f;font:15px system-ui}button,select{margin:5px;padding:7px}canvas{width:100%;height:600px;display:block}pre{white-space:pre-wrap}#gallery{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;padding:12px;background:repeating-conic-gradient(#ccc 0% 25%,#eee 0% 50%) 0/18px 18px}figure img{width:240px;height:240px;object-fit:contain}figcaption{background:#fff}#stage{touch-action:none}</style><h1>公共服务建筑 · 独立候选审查</h1><p>建筑仅表达外观，不代表贡献项目类型。新图、旧图复用和待验收状态见下方审计。拖动平移；全景、150%和最大倍率均由正式 CityView 绘制。</p><label>样本 <select id="years"><option>1</option><option>3</option><option>20</option></select> 年</label><select id="display"><option value="isolated">候选隔离（隐藏其他模型）</option><option value="mixed">完整合成混排</option></select><button id="open">重新打开</button><button id="fit">全景</button><button id="near">150%</button><button id="max">当前最大倍率</button><select id="target"></select><button id="focus">最大倍率聚焦所选候选</button><button id="close">关闭释放</button><p id="status">加载中</p><div id="stage"></div><h2>透明原图边缘检查</h2><label>素材背景 <select id="background"><option value="checker">透明棋盘</option><option value="#20282b">深色</option><option value="#ffffff">白色</option></select></label><div id="gallery"></div><pre id="audit"></pre><script type="module" src="/main.ts"></script></html>
