<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeYears · 城与山的岁月</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#233e33;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:50px auto;padding:0 28px}.eyebrow{color:#6c8477;font-size:12px;letter-spacing:.12em}h1{font-size:clamp(36px,5vw,58px);line-height:1.08;letter-spacing:-.05em;margin:12px 0 14px;font-weight:650}.intro{font-size:18px;color:#62776c;margin:0 0 28px}.city{overflow:hidden;border:1px solid #dce8e1;border-radius:26px;background:#eef4f2;box-shadow:0 18px 60px #203a2b09}.heading{padding:24px 28px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:20px;letter-spacing:-.025em;margin:0}.note{color:#6b8174;font-size:12px;margin:5px 0}.scene{height:clamp(320px,52vh,480px)}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 24px 24px}.progress{flex:1 1 220px;font-size:13px;color:#536e60;font-variant-numeric:tabular-nums}button,select{font:inherit;border:1px solid #cbdcd1;border-radius:12px;background:#fff;color:#294838;padding:9px 15px;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #268f80;outline-offset:3px}.primary{background:#285c47;color:white;border-color:#285c47}.foot{margin:18px 4px;color:#75897d;font-size:12px}label{font-size:12px;color:#61786b}select{margin-left:8px;padding:7px 10px}
  .heading{flex-wrap:wrap}.view-picker{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:16px 28px 0}.view-picker span{font-size:12px;color:#71867a}.view-picker label{font-size:13px}
</style></head>
<body><main>
  <div class="eyebrow">CODEYEARS · 本地交互预览</div><h1>代码岁月，自成风景。</h1>
  <p class="intro">一年一片风景，在城市与山脉间，重访每一天。</p>
  <section class="city" aria-label="贡献风景示例">
    <div class="heading"><div><h2 id="year-title">贡献之城</h2><p class="note" id="summary"></p></div><div><label>时间范围<select id="range"><option value="1">2024 · 一年</option><option value="3" selected>2023–2025 · 三年</option><option value="20">2006–2025 · 二十年</option></select></label><label>示例密度<select id="density"><option value="regular">常规</option><option value="dense">高密度</option><option value="sparse">稀疏</option></select></label></div></div>
    <div class="view-picker"><label>贡献视图<select id="view"><option value="city">City · 贡献之城</option><option value="terrain">Terrain · 时光山脉</option></select></label><span>按年份分区 · 切换保留播放位置</span></div>
    <div class="scene" id="scene"></div>
    <div class="controls"><span class="progress" id="progress"></span><button class="primary" id="replay">重播生长</button><button id="pause">暂停</button><button id="skip">跳过动画</button></div>
  </section>
  <p class="foot">此页使用确定性示例数据，不是真实 GitHub 贡献。真实数据请从扩展打开 GitHub 个人主页。拖动旋转 · 滚轮缩放</p>
</main><script type="module" src="/main.ts"></script></body></html>
