<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>城市轮廓候选对照</title>
<style>body{font:14px system-ui;background:#f4f5ef;color:#25352b;margin:20px}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}article{min-width:0}canvas{width:100%;height:580px;touch-action:none;background:#a3b58d;border-radius:12px}pre{white-space:pre-wrap;max-height:240px;overflow:auto}button,select{padding:6px}h1{font-size:20px}#status{min-height:36px}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<h1>City · 城市轮廓与长期空档分城（工程候选）</h1>
<p>相同日期与数量、相同 ISO 周坐标。60/90/120 天仅用于比较，尚非产品决策。滚轮缩放、拖动平移同步两图。</p>
<header><label>范围 <select id="years"><option>1</option><option selected>3</option><option>20</option></select> 年</label>
<label>样本 <select id="sample"><option value="sparse">稀疏工作日</option><option value="dense">持续密集</option><option value="gap">长期中断＋孤立贡献</option><option value="cross">跨年中断</option><option value="zero">全零</option><option value="partial">未完成/缺失/未来</option></select></label>
<label>实验阈值 <select id="threshold"><option>60</option><option selected>90</option><option>120</option></select> 天</label>
<button id="fill">补齐未完成样本</button><button id="fit">全景</button><button id="near">近景</button><button id="close">关闭</button><button id="open">重开</button></header>
<p id="status"></p><main><article><h2>当前矩形布局</h2><div id="old"></div></article><article><h2>候选：退让 / 分段聚落</h2><div id="new"></div></article></main><details><summary>输入规则、守恒与空档依据</summary><pre id="audit"></pre></details><script type="module" src="/main.ts"></script></html>
