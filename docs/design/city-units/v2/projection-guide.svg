<text x="205" y="563" font-size="11" fill="#64756b">W+D</text>
<circle cx="152" cy="545" r="3" fill="#285c47"/>
<text x="157" y="539" font-size="11" fill="#64756b">D</text>
<text x="62" y="640" font-size="14" fill="#64756b">占地 1 格 · 两组平行边始终同向</text>
