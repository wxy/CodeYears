<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">CodeYears 统一地面投影模板</title>
<desc id="desc">地面基向量为 48,24 和 -48,24，所有占地使用同一比例，竖直方向为 0,-48。包括1乘1、2乘1、1乘2、2乘2、3乘2、2乘3和3乘3。</desc>
<rect width="1440" height="1040" fill="#faf9f5"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#24382f">
<text x="54" y="59" font-size="30" font-weight="650">CodeYears · 统一地面投影</text>
<text x="54" y="91" font-size="17" fill="#64756b">所有单元共用同一地面基向量；占地扩展不改变边的方向，竖直边不倾斜。</text>
<polygon points="264,246 360,294 264,342 168,294" fill="#e5eddf" stroke="#527a60" stroke-width="2"/>
<path d="M312 270L216 318" fill="none" stroke="#9ea99e" stroke-width="0.9"/>
<path d="M216 270L312 318" fill="none" stroke="#9ea99e" stroke-width="0.9"/>
<polygon points="264,150 360,198 264,246 168,198" fill="#dbe7e8" fill-opacity=".55" stroke="#608790" stroke-width="1.6"/>
<path d="M264 246L264 150" fill="none" stroke="#608790" stroke-width="1.5"/>
<path d="M360 294L360 198" fill="none" stroke="#608790" stroke-width="1.5"/>
<path d="M264 342L264 246" fill="none" stroke="#608790" stroke-width="1.5"/>
<path d="M168 294L168 198" fill="none" stroke="#608790" stroke-width="1.5"/>
<text x="70" y="132" font-size="17" fill="#64756b">示例：2×2×2，地面与屋顶的平行边方向相同</text>
<text x="125" y="370" font-size="14" fill="#64756b">竖边只沿 H 轴；屋顶可退台，方向仍由同一投影决定。</text>
<text x="650" y="164" font-size="24" fill="#285c47">P(W,D,H) = (48(W−D), 24(W+D)−48H)</text>
<text x="650" y="205" font-size="20" fill="#64756b">W 轴：(+48, +24)    D 轴：(−48, +24)</text>
<text x="650" y="241" font-size="20" fill="#64756b">地面边斜率：+0.5 / −0.5，约 ±26.565°</text>
<text x="650" y="278" font-size="18" fill="#64756b">H 轴：(0, −48)，竖直向上；所有尺寸统一等比变化</text>
<text x="650" y="319" font-size="17" fill="#64756b">地面四角决定占地，落地点决定位置，结构顶部决定高度。</text>
<text x="650" y="350" font-size="17" fill="#64756b">下方七种占地共用同一个地面格尺寸，未逐项放大填框。</text>
<rect x="40" y="410" width="320" height="253" rx="16" fill="#fff" stroke="#dce2d9"/>
<text x="62" y="446" font-size="22" fill="#285c47">1×1</text>
