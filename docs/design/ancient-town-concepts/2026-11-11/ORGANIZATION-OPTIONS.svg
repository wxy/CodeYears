<text x="1378" y="706" class="body">阶段清楚，逐日日期需在簇内展开</text>
<text x="1378" y="750" class="small">簇内邻接可保留；簇间重新组织</text>
<text x="1378" y="790" class="small">每簇独立矩形场地，不用不规则拼图</text>
<rect x="50" y="886" width="1920" height="174" fill="#e2e5d3" stroke="none" rx="12"/>
<text x="78" y="934" class="h">用途与项目的映射必须有实际活动明细支持</text>
<text x="78" y="976" class="body">每日贡献总量只能表达强度，不能判断是提交、评审、Issue，也不能推断属于哪个项目。</text>
<text x="78" y="1019" class="body">后续可在有明细的范围内，以建筑用途或项目聚落表达；未取得明细时保留中性强度造型。</text>
